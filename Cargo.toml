[package]
name = "sofie"
version = "0.0.4-beta.1"
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/sofie"
homepage = "https://github.com/ararog/sofie"
description = "🌟 The elegant full-stack web framework that makes Rust web development effortless"
readme = "README.md"
license = "MIT"
keywords = ["framework", "backend", "rest-server", "rest"]
publish = true
rust-version = "1.75.0"

[features]
default = []

[dependencies]
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
http = "1.4.2"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["server"] }
hyper-util = "0.1.19"
log = "0.4.32"
thiserror = "2.0.18"
vetis = { version = "0.1.4-beta.7" }
vetis-tokio = { version = "0.1.0-beta.3", features = [
  "http2",
  "rust-tls"
], default-features = false }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
toml = "1.1.2"
serde = "1.0.228"
matchit = "0.9.2"
env_logger = "0.11.10"
std-logger = "0.5.9"
